<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Mãos que Transformam - Cadastro</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>Cadastro de voluntário</h1><nav aria-label="Navegação principal"><a href="index.html">Início</a><a href="projetos.html">Projetos</a><a href="cadastro.html">Cadastro</a></nav></header>
<main><section><h2>Quero participar</h2><p>Preencha seus dados para demonstrar interesse em participar das ações da ONG.</p>
<form action="#" method="post">
<fieldset><legend>Dados pessoais</legend>
<label for="nome">Nome completo:</label><input type="text" id="nome" name="nome" required minlength="3">
<label for="email">E-mail:</label><input type="email" id="email" name="email" required>
<label for="nascimento">Data de nascimento:</label><input type="date" id="nascimento" name="nascimento" required>
<label for="cpf">CPF:</label><input type="text" id="cpf" name="cpf" required placeholder="000.000.000-00" pattern="[0-9]{3}\.?[0-9]{3}\.?[0-9]{3}-?[0-9]{2}" title="Digite um CPF no formato 000.000.000-00">
</fieldset>
<fieldset><legend>Contato e endereço</legend>
<label for="telefone">Telefone:</label><input type="tel" id="telefone" name="telefone" required placeholder="(11) 99999-9999" pattern="\([0-9]{2}\) [0-9]{4,5}-[0-9]{4}" title="Digite o telefone no formato (11) 99999-9999">
<label for="cep">CEP:</label><input type="text" id="cep" name="cep" required placeholder="00000-000" pattern="[0-9]{5}-?[0-9]{3}" title="Digite o CEP no formato 00000-000">
<label for="endereco">Endereço:</label><input type="text" id="endereco" name="endereco" required>
<label for="cidade">Cidade:</label><input type="text" id="cidade" name="cidade" required>
<label for="estado">Estado:</label><select id="estado" name="estado" required><option value="">Selecione</option><option>SP</option><option>RJ</option><option>MG</option><option>PR</option><option>SC</option><option>RS</option><option>BA</option><option>PE</option><option>Outro</option></select>
</fieldset>
<fieldset><legend>Interesse</legend><label for="interesse">Como deseja ajudar?</label><select id="interesse" name="interesse" required><option value="">Selecione</option><option>Voluntariado</option><option>Doação financeira</option><option>Doação de alimentos</option><option>Outro</option></select><label for="mensagem">Mensagem:</label><textarea id="mensagem" name="mensagem" rows="5" placeholder="Conte como gostaria de participar."></textarea></fieldset>
<button type="submit">Enviar cadastro</button></form></section></main>
<footer><p>&copy; 2026 Mãos que Transformam - Projeto acadêmico.</p></footer>
</body></html>
